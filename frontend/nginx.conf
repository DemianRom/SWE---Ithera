server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # TLS y compresión los resuelve el reverse proxy (Caddy).
    absolute_redirect off;

    # Archivos con hash generados por Vite: se pueden cachear para siempre.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: cualquier ruta del cliente devuelve index.html, sin caché para que
    # cada deploy se vea de inmediato.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
