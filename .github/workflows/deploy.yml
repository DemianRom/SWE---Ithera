name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # DEPLOY_KEY está restringida en el servidor: solo puede ejecutar deploy.sh,
      # que hace fast-forward a origin/main y reconstruye los contenedores.
      # Destino y huella del host viven en secrets para no publicarlos en el repo.
      - name: Deploy en el servidor
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_TARGET: ${{ secrets.DEPLOY_TARGET }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          for var in DEPLOY_KEY DEPLOY_TARGET DEPLOY_KNOWN_HOSTS; do
            if [[ -z "${!var}" ]]; then
              echo "::error::Falta el secret $var (ver docs/deploy/README.md)"; exit 1
            fi
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          # Huella pública (no secreta) para detectar un secret mal copiado
          expected='SHA256:+IcA0YGfwt89kSGkbThwENOLEdE5c54c/gzR8SHaY6A'
          if ! pub=$(ssh-keygen -y -f ~/.ssh/deploy_key 2>&1); then
            echo "::error::DEPLOY_KEY no es una llave privada válida"; exit 1
          fi
          fp=$(ssh-keygen -lf - <<< "$pub")
          if [[ "$fp" != *"$expected"* ]]; then
            echo "::error::DEPLOY_KEY no coincide con la llave esperada ($expected)"; exit 1
          fi
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_TARGET"
